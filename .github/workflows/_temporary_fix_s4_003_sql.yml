name: Temporary S4-003 SQL Parser Fix

on:
  push:
    branches:
      - 'task/s4-003-drawer-eligibility-refunds'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/s4-003-drawer-eligibility-refunds
          fetch-depth: 0

      - name: Patch exact PostgreSQL CASE expression
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/migrations/20260801110000_drawer_policy_customer_refunds.sql')
          text = path.read_text(encoding='utf-8')
          old = "v_existing.cash_session_id IS DISTINCT FROM CASE WHEN v_method = 'CASH' THEN p_cash_session_id ELSE NULL END"
          new = "v_existing.cash_session_id IS DISTINCT FROM (CASE WHEN v_method = 'CASH' THEN p_cash_session_id ELSE NULL END)"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one parser target, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit parser fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-tauri/migrations/20260801110000_drawer_policy_customer_refunds.sql
          git commit -m 'fix(s4): parenthesize refund authorization CASE expression'
          git push origin HEAD:task/s4-003-drawer-eligibility-refunds
