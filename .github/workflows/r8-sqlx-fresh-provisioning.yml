name: R8 Fresh SQLx Provisioning Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/r8-001-provision-acceptance-database-v3.ps1'
      - 'src-tauri/migrations/**'
      - '.github/workflows/r8-sqlx-fresh-provisioning.yml'
  push:
    branches:
      - 'task/r8-001-reproducible-sqlx-provisioning'
    paths:
      - 'scripts/r8-001-provision-acceptance-database-v3.ps1'
      - 'src-tauri/migrations/**'
      - '.github/workflows/r8-sqlx-fresh-provisioning.yml'

permissions:
  contents: read

jobs:
  fresh-sqlx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stockiha_r8_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockiha_r8_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: stockiha_r8_control
      DATABASE_URL: postgres://stockiha_migrator:migrator_ci_password@127.0.0.1:5432/stockiha_r8_acceptance_ci_test
      STOCKIHA_R8_ADMIN_MIGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/stockiha_r8_acceptance_ci_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install SQLx CLI 0.8.6
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked

      - name: Bootstrap exact Stockiha role posture
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE stockiha_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE stockiha_migrator LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'migrator_ci_password';
          CREATE ROLE stockiha_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'runtime_ci_password';
          CREATE ROLE stockiha_backup LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'backup_ci_password';
          GRANT stockiha_owner TO stockiha_migrator WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          SQL

      - name: Run exact cross-platform R8 provisioning helper
        shell: pwsh
        run: |
          ./scripts/r8-001-provision-acceptance-database-v3.ps1 `
            -DatabaseName stockiha_r8_acceptance_ci_test

      - name: Verify historical migration files were not rewritten
        run: |
          git diff --exit-code origin/main -- \
            src-tauri/migrations/20260725130000_procurement_landed_cost_and_invoices.sql \
            src-tauri/migrations/20260725130100_inventory_allocate_landed_cost.sql \
            src-tauri/migrations/20260725130200_procurement_confirm_supplier_invoice.sql \
            src-tauri/migrations/20260725140000_procurement_supplier_returns_and_payments.sql \
            src-tauri/migrations/20260725140100_inventory_confirm_supplier_return.sql \
            src-tauri/migrations/20260725140200_procurement_post_supplier_payment.sql \
            src-tauri/migrations/20260731125975_cash_session_function_owner_compat.sql \
            src-tauri/migrations/20260731125990_cash_session_api_collision_compat.sql \
            src-tauri/migrations/20260801100000_s4_003_function_owner_compat.sql \
            src-tauri/migrations/20260803125900_r2_s3_owner_compat.sql
