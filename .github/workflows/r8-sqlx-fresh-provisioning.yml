name: R8 Fresh SQLx Provisioning Proof

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/r8-001-provision-acceptance-database.ps1'
      - 'src-tauri/migrations/**'
      - '.github/workflows/r8-sqlx-fresh-provisioning.yml'
  push:
    branches:
      - 'task/r8-001-reproducible-sqlx-provisioning'
    paths:
      - 'scripts/r8-001-provision-acceptance-database.ps1'
      - 'src-tauri/migrations/**'
      - '.github/workflows/r8-sqlx-fresh-provisioning.yml'

permissions:
  contents: read

jobs:
  fresh-sqlx:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: stockiha_r8_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockiha_r8_control"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGPASSWORD: postgres
      ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/stockiha_r8_control
      DATABASE_URL: postgres://stockiha_migrator:migrator_ci_password@127.0.0.1:5432/stockiha_r8_acceptance_ci_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install SQLx CLI 0.8.6
        run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features postgres --locked

      - name: Bootstrap exact Stockiha role posture
        run: |
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE stockiha_owner NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE stockiha_migrator LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'migrator_ci_password';
          CREATE ROLE stockiha_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'runtime_ci_password';
          CREATE ROLE stockiha_backup LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'backup_ci_password';
          GRANT stockiha_owner TO stockiha_migrator WITH ADMIN FALSE, INHERIT FALSE, SET TRUE;
          CREATE DATABASE stockiha_r8_acceptance_ci_test WITH OWNER = stockiha_owner ENCODING = 'UTF8';
          GRANT CONNECT ON DATABASE stockiha_r8_acceptance_ci_test TO stockiha_migrator, stockiha_runtime, stockiha_backup;
          SQL
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -d stockiha_r8_acceptance_ci_test <<'SQL'
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO stockiha_migrator;
          SQL

      - name: Run normal pre-S3 SQLx phase
        run: sqlx migrate run --source src-tauri/migrations --target-version 20260725120200

      - name: Verify SQLx metadata ownership
        run: |
          owner="$(psql "$ADMIN_URL" -X -At -v ON_ERROR_STOP=1 -d stockiha_r8_acceptance_ci_test -c "SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid = 'public._sqlx_migrations'::regclass;")"
          test "$owner" = "stockiha_migrator"

      - name: Run immutable legacy S3 owner bridge
        run: |
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -d stockiha_r8_acceptance_ci_test -c \
            "GRANT SELECT, INSERT, UPDATE ON TABLE public._sqlx_migrations TO stockiha_owner;"
          PGOPTIONS='-c role=stockiha_owner' sqlx migrate run \
            --source src-tauri/migrations \
            --target-version 20260725140200
          psql "$ADMIN_URL" -X -v ON_ERROR_STOP=1 -d stockiha_r8_acceptance_ci_test -c \
            "REVOKE SELECT, INSERT, UPDATE ON TABLE public._sqlx_migrations FROM stockiha_owner;"

      - name: Continue normal SQLx migration chain
        run: |
          unset PGOPTIONS
          sqlx migrate run --source src-tauri/migrations
          sqlx migrate run --source src-tauri/migrations

      - name: Verify final least-privilege state
        run: |
          result="$(psql "$ADMIN_URL" -X -At -v ON_ERROR_STOP=1 -d stockiha_r8_acceptance_ci_test <<'SQL'
          SELECT
            (SELECT pg_get_userbyid(relowner) FROM pg_class WHERE oid = 'public._sqlx_migrations'::regclass) || ':' ||
            (SELECT version::text FROM public._sqlx_migrations ORDER BY version DESC LIMIT 1) || ':' ||
            (SELECT migration_version::text FROM operations.schema_state WHERE singleton) || ':' ||
            has_table_privilege('stockiha_owner', 'public._sqlx_migrations', 'SELECT')::int || ':' ||
            has_table_privilege('stockiha_owner', 'public._sqlx_migrations', 'INSERT')::int || ':' ||
            has_table_privilege('stockiha_owner', 'public._sqlx_migrations', 'UPDATE')::int || ':' ||
            has_table_privilege('stockiha_backup', 'public._sqlx_migrations', 'SELECT')::int || ':' ||
            has_table_privilege('stockiha_backup', 'public._sqlx_migrations', 'INSERT')::int || ':' ||
            has_schema_privilege('stockiha_runtime', 'public', 'CREATE')::int;
          SQL
          )"
          test "$result" = "stockiha_migrator:20260807230000:20260807230000:0:0:0:1:0:0"

      - name: Prove historical migration files were not rewritten
        run: |
          git diff --exit-code origin/main -- \
            src-tauri/migrations/20260725130000_procurement_landed_cost_and_invoices.sql \
            src-tauri/migrations/20260725130100_inventory_allocate_landed_cost.sql \
            src-tauri/migrations/20260725130200_procurement_confirm_supplier_invoice.sql \
            src-tauri/migrations/20260725140000_procurement_supplier_returns_and_payments.sql \
            src-tauri/migrations/20260725140100_inventory_confirm_supplier_return.sql \
            src-tauri/migrations/20260725140200_procurement_post_supplier_payment.sql
