name: Temporary S4-003 Cached Result Fix

on:
  push:
    branches:
      - 'task/s4-003-drawer-eligibility-refunds'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task/s4-003-drawer-eligibility-refunds
          fetch-depth: 0

      - name: Patch cached refund result contract and test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('src-tauri/migrations/20260801110000_drawer_policy_customer_refunds.sql')
          text = migration.read_text(encoding='utf-8')
          old = """            'available_credit', (c.credit_limit - cs.exposure_amount)::text,
            'journal_document_id', r.journal_document_id
        ) INTO v_result
        FROM core.business_documents d
        JOIN receivables.customer_payment_refunds r ON r.document_id = d.id
        JOIN receivables.customers c ON c.id = r.customer_id
        JOIN receivables.customer_credit_state cs ON cs.customer_id = r.customer_id
        WHERE d.id = v_cached_result;"""
          new = """            'available_credit', (c.credit_limit - cs.exposure_amount)::text,
            'journal_document_id', r.journal_document_id,
            'refund_ledger_entry_id', l.id
        ) INTO v_result
        FROM core.business_documents d
        JOIN receivables.customer_payment_refunds r ON r.document_id = d.id
        JOIN receivables.customers c ON c.id = r.customer_id
        JOIN receivables.customer_credit_state cs ON cs.customer_id = r.customer_id
        JOIN receivables.customer_ledger_entries l
          ON l.document_id = r.document_id
         AND l.customer_id = r.customer_id
         AND l.entry_type = 'PAYMENT_REFUND'
        WHERE d.id = v_cached_result;"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected one cached-result block, found {text.count(old)}')
          migration.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('src-tauri/tests/receivables/s4_003_drawer_refund_integration.sql')
          test_text = test.read_text(encoding='utf-8')
          old_test = """    IF (v_refund_1_retry->>'document_id')::bigint <> v_refund_1_doc THEN
        RAISE EXCEPTION 'Assertion failed: refund retry returned another document';
    END IF;"""
          new_test = """    IF (v_refund_1_retry->>'document_id')::bigint <> v_refund_1_doc THEN
        RAISE EXCEPTION 'Assertion failed: refund retry returned another document';
    END IF;
    IF nullif(v_refund_1_retry->>'refund_ledger_entry_id', '')::bigint IS NULL THEN
        RAISE EXCEPTION 'Assertion failed: refund retry omitted refund ledger result identity';
    END IF;"""
          if test_text.count(old_test) != 1:
              raise SystemExit(f'Expected one retry assertion block, found {test_text.count(old_test)}')
          test.write_text(test_text.replace(old_test, new_test), encoding='utf-8')
          PY

      - name: Commit cached result fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src-tauri/migrations/20260801110000_drawer_policy_customer_refunds.sql \
            src-tauri/tests/receivables/s4_003_drawer_refund_integration.sql
          git commit -m 'fix(s4): return complete cached refund result'
          git push origin HEAD:task/s4-003-drawer-eligibility-refunds
