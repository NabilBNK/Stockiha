[package]
name = "stockiha-backend"
version = "0.1.0"
description = "Stockiha desktop inventory, sales, procurement and reporting application"
authors = ["Raqmenha"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "stockiha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# S0-003: PostgreSQL connectivity proof. Minimal feature set by mandate:
# - runtime-tokio: matches Tauri's Tokio runtime.
# - postgres: the only target driver (PostgreSQL 18.x).
# Deliberately excluded until a task needs them: TLS (loopback-only for now),
# macros/offline (no compile-time queries), migrate (S0-004+), and the
# uuid/chrono/rust_decimal type integrations (no domain types yet).
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
# S0-005: zeroize the in-memory secret buffers read from the credential store.
zeroize = "1.9.0"

# S0-007: backend PDF generation proof. Embedded Typst compiler pipeline,
# pinned exactly (offline, in-process; no `typst` CLI, no browser, no cloud).
# Justification per crate: `typst` = compiler core + `World`/`Library`/fonts;
# `typst-layout` = the `PagedDocument` output type (page count/size); `typst-pdf`
# = PDF export; `typst-assets` (feature `fonts`) = OFL Latin fonts baked in for
# deterministic Latin/French. Arabic uses the bundled OFL Amiri face
# (`include_bytes!`), so no system fonts are searched (keeps output identical
# on every machine). No `rust_decimal`/`chrono`/`tempfile` are pulled in.
typst = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }

# S0-009: backup bundle creation proof. `sha2` computes the manifest/checksums
# SHA-256 digests (audited, minimal, no unsafe). `time` renders the UTC bundle
# directory name (`GestStock-Backup-YYYYMMDD-HHMMSS`) without hand-rolled
# calendar math; only the `std` feature is enabled (no `formatting`/`macros`
# — the timestamp is built from plain field accessors). Both are already
# transitively locked by the existing dependency graph at these exact
# versions, so pinning them here adds zero new packages and zero lock churn.
sha2 = "=0.10.9"
time = { version = "=0.3.53", default-features = false, features = ["std"] }

# S0-005: Windows Credential Manager access (Win32 generic credentials).
# S0-008: adds `Win32_Graphics_Printing` (OpenPrinterW/StartDocPrinterW/
# StartPagePrinter/WritePrinter/EndPagePrinter/EndDocPrinter/AbortPrinter/
# ClosePrinter) for the RAW spooler proof. `Win32_Graphics_Gdi` is also
# required: in windows-sys 0.61.2, `OpenPrinterW`'s own binding is gated on
# that feature because its `PRINTER_DEFAULTSW` parameter type lives behind it
# (confirmed by compiling against the real crate source, not assumed) — no
# GDI/DEVMODE value is ever constructed or used, only the type must resolve.
# Same existing crate, no new dependency — only the feature list grows,
# scoped to Windows targets.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
] }

[dev-dependencies]
# Used only by unit tests to assert the exact serialized wire shape of `IpcError`.
serde_json = "1"
# S0-003: async runtime for the opt-in PostgreSQL integration tests only.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
